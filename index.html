<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>新竹縣政府勞工處｜議會備詢速答助手</title>
<style>
:root{--bg:#f6f8fb;--card:#fff;--text:#172033;--muted:#6b7280;--line:#dde3ec;--blue:#2563eb;--blueSoft:#eaf0ff;--warn:#fff8e8}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif}
.wrap{max-width:920px;margin:auto;padding:18px}
header{margin:4px 0 18px}
h1{font-size:26px;line-height:1.2;margin:0 0 6px}
.sub{font-size:14px;color:var(--muted)}
.sectionTitle{font-size:14px;font-weight:800;margin:14px 0 8px}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chip{border:1px solid var(--line);background:#fff;color:var(--text);border-radius:999px;padding:10px 14px;min-height:42px;font-size:15px}
.chip.active{background:var(--blue);color:#fff;border-color:var(--blue)}
.search{display:grid;grid-template-columns:1fr auto;gap:8px;margin-top:12px}
input{width:100%;border:1px solid var(--line);background:#fff;border-radius:14px;padding:13px 14px;font-size:16px;min-height:48px}
.primary{border:0;border-radius:14px;background:var(--blue);color:#fff;font-weight:800;font-size:16px;padding:0 20px;min-height:48px}
.topicRow{display:flex;gap:8px;overflow-x:auto;padding:10px 0 2px;scrollbar-width:none}
.topicRow::-webkit-scrollbar{display:none}
.topicBtn{white-space:nowrap;border:1px solid var(--line);background:#fff;border-radius:12px;padding:10px 13px;font-size:14px;min-height:42px}
.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:18px;margin-top:16px}
.kicker{font-size:12px;color:var(--muted);font-weight:800}
.topic{font-size:21px;font-weight:850;margin:6px 0 10px;line-height:1.35}
.answer{font-size:17px;line-height:1.75}
.block{margin-top:14px;padding:14px;border-radius:14px;background:#f8fafc}
.block strong{display:block;color:var(--muted);font-size:12px;margin-bottom:6px}
.numbers{font-size:18px;font-weight:800;line-height:1.65}
.follow,.historyText{font-size:15px;line-height:1.65}
.note{background:var(--warn)}
.hidden{display:none}
.legHistory{margin-top:10px;padding:12px 14px;background:#eef4ff;border-radius:14px}
.legHistory b{display:block;font-size:13px;margin-bottom:4px}
footer{text-align:center;color:var(--muted);font-size:11px;padding:18px 0 8px}
@media(max-width:640px){
 .wrap{padding:14px}
 h1{font-size:23px}
 .sub{font-size:13px;line-height:1.5}
 .search{grid-template-columns:1fr}
 .primary{width:100%}
 .chip{font-size:14px;padding:9px 12px;min-height:40px}
 .card{padding:16px}
 .topic{font-size:19px}
 .answer{font-size:16px}
 .numbers{font-size:17px}
 .sectionTitle{margin-top:12px}
}
</style>
</head>
<body>
<div class="wrap">
<header>
  <h1>議會備詢速答助手</h1>
  <div class="sub">新竹縣政府勞工處｜先選議員，再查關鍵題目</div>
</header>

<div class="sectionTitle">議員</div>
<div class="chips" id="legislators">
  <button class="chip active" data-leg="全部">全部</button>
  <button class="chip" data-leg="羅美文">羅美文</button>
  <button class="chip" data-leg="歐陽霆">歐陽霆</button>
  <button class="chip" data-leg="朱健銘">朱健銘</button>
  <button class="chip" data-leg="林志潔">林志潔</button>
  <button class="chip" data-leg="林禹佑">林禹佑</button>
</div>

<div id="legHistory" class="legHistory hidden">
  <b id="legTitle"></b>
  <div id="legTopics" class="historyText"></div>
</div>

<div class="search">
  <input id="qInput" placeholder="輸入關鍵字，例如：勞檢人力、身障進用、銀髮、移工">
  <button class="primary" id="searchBtn">速答</button>
</div>

<div class="sectionTitle">常用題目</div>
<div class="topicRow">
  <button class="topicBtn" data-q="身障就業">身障就業</button>
  <button class="topicBtn" data-q="銀髮就業">銀髮就業</button>
  <button class="topicBtn" data-q="勞檢人力">勞檢人力</button>
  <button class="topicBtn" data-q="HR勞動法令小學堂">HR小學堂</button>
  <button class="topicBtn" data-q="預算">預算</button>
  <button class="topicBtn" data-q="移工">移工</button>
  <button class="topicBtn" data-q="工會">工會</button>
</div>

<section class="card" aria-live="polite">
  <div class="kicker">建議回答</div>
  <div class="topic" id="topic">請選議員或輸入問題</div>
  <div class="answer" id="answer">系統會顯示建議答法、關鍵數字及可能追問。</div>
  <div class="block hidden" id="numbersBox"><strong>關鍵數字</strong><div class="numbers" id="numbers"></div></div>
  <div class="block hidden" id="followBox"><strong>可能追問</strong><div class="follow" id="follow"></div></div>
  <div class="block note hidden" id="sourceBox"><strong>資料來源／時間點</strong><div class="follow" id="source"></div></div>
</section>

<footer>議場使用版｜未收錄內容不自行推測</footer>
</div>

<script>
const history={
"羅美文":["勞工教育補助與講師費","HR勞動法令小學堂","勞檢人力","中學勞權教育","勞工權益補助","遠東工安","勞工消費合作社","勞工博物館"],
"歐陽霆":["外籍移工管理"],
"朱健銘":["職災勞工服務","移工權益保障","身障就業與職涯重建"],
"林志潔":["銀髮就業","身障就業"],
"林禹佑":["重大職災與通報"]
};

const data=[
{keys:["身障","進用"],topic:"身心障礙者就業與定額進用",answer:"本縣整體定額進用情形高於法定需求。備詢時先回答整體進用情形，再補充足額、超額及實際進用人數。",numbers:"平均應進用單位594家；足額322家、超額199家；法定應進用2,434人，實際進用3,324人，整體進用率137%。",follow:"不足額單位如何處理？可接續說明依法追蹤、輔導及促進身障就業措施。",source:"第20屆第8次定期會業務報告（115/9/29版）"},
{keys:["銀髮","高齡"],topic:"銀髮就業",answer:"本府持續透過銀髮人才服務據點推動職業諮詢、企業開發、宣導與就業媒合。",numbers:"求職求才服務573人次；法令及職涯諮詢447人次；銀髮人力開發272人次；成功媒合131人。",follow:"可能追問據點成效、企業開發、服務量能及中央資源分工。",source:"第20屆第8次定期會業務報告（115/9/29版）"},
{keys:["工會"],topic:"本縣工會概況",answer:"本縣工會組織維持穩定，可先用家數與會員數回答，再依問題補充總工會及基層工會。",numbers:"工會165家，其中縣級總工會3家、基層工會162家；會員約6.7萬人。",follow:"可能追問勞工教育補助、講師費及課程內容。",source:"第20屆第8次定期會業務報告（115/9/29版）"},
{keys:["移工","外國人"],topic:"移工服務與管理",answer:"移工服務涵蓋入國通報、訪視查察、離境驗證及勞資爭議處理，兼顧權益保障與合法聘僱管理。",numbers:"入國通報4,168件；訪視查察3,090件；提前終止聘僱關係離境驗證903件；外國人勞資爭議244件；違反就業服務法裁罰61件、806萬元。",follow:"可能追問爭議類型、查察成效及違法處理。",source:"第20屆第8次定期會業務報告（115/9/29版）"},
{keys:["預算","中央補助","縣庫"],topic:"115／116年度預算變化",answer:"116年度總預算較115年度小幅增加，但財源結構是縣庫負擔增加、中央補助減少。",numbers:"115年度155,779,000元；116年度156,953,000元。縣庫56,935,522元增至67,731,410元；中央補助98,843,478元降至89,221,590元。",follow:"可能追問中央補助為何減少、哪些計畫受影響、縣庫增加支應哪些項目。",source:"115、116年度歲出計畫說明提要與各項費用明細表"},
{keys:["勞檢","檢查員","擴編"],topic:"勞動檢查人力",answer:"現有勞動檢查員額7人，另以身心障礙者就業基金增置2名助理員協助行政庶務；中央如釋出員額，本府將積極爭取。",numbers:"115年3月資料：本縣公司及商業登記37,901家，約占全國2%；中央補助地方勞檢員額全國325名；本縣現有勞檢員7人。",follow:"可能追問為何不能直接擴編至10人、每年檢查量及人力是否足夠。",source:"第20屆第7次定期會羅美文議員口頭質詢處理情形"},
{keys:["HR","小學堂","LINE"],topic:"HR勞動法令小學堂 LINE 社群",answer:"該LINE社群為本處離職勞檢員自行建置，並非本府官方帳號，本府無權派員擔任私人社群管理員；目前以1999、縣民信箱及勞工處Facebook等正式管道提供諮詢。",numbers:"數位發展處曾評估整合AI客服；考量人力、經費及無法提供24小時即時回覆，目前尚難由勞工處單獨建置LINE官方帳號。",follow:"若追問縣長指示進度：已完成權責釐清與可行性評估，後續配合數位發展處AI客服整合規劃。",source:"第20屆第7次定期會質詢事項執行進度，資料整理至115/9/29"}
];

let selectedLeg="全部";
const qInput=document.getElementById("qInput");

function selectLeg(name){
 selectedLeg=name;
 document.querySelectorAll("[data-leg]").forEach(b=>b.classList.toggle("active",b.dataset.leg===name));
 const box=document.getElementById("legHistory");
 if(name==="全部"){box.classList.add("hidden");return;}
 document.getElementById("legTitle").textContent=name+"議員過去關切";
 document.getElementById("legTopics").textContent=(history[name]||[]).join("、");
 box.classList.remove("hidden");
}

function run(q){
 q=(q||"").trim();
 const topic=document.getElementById("topic"),answer=document.getElementById("answer");
 const nb=document.getElementById("numbersBox"),fb=document.getElementById("followBox"),sb=document.getElementById("sourceBox");
 if(!q){
   if(selectedLeg!=="全部"){
     topic.textContent=selectedLeg+"議員過去關切題";
     answer.textContent=(history[selectedLeg]||[]).join("、")||"目前尚未整理到該議員的歷史題目。";
   }else{
     topic.textContent="請選議員或輸入問題";
     answer.textContent="系統會顯示建議答法、關鍵數字及可能追問。";
   }
   nb.classList.add("hidden");fb.classList.add("hidden");sb.classList.add("hidden");return;
 }
 let best=null,score=0;
 data.forEach(item=>{let s=item.keys.reduce((n,k)=>n+(q.includes(k)?1:0),0);if(s>score){score=s;best=item;}});
 if(!best){
   topic.textContent="尚未收入題庫："+q;
   answer.textContent="現有資料未載明，建議由主管科補充；本系統不自行推測。";
   nb.classList.add("hidden");fb.classList.remove("hidden");sb.classList.remove("hidden");
   document.getElementById("follow").textContent=selectedLeg!=="全部"?"可先查看「"+selectedLeg+"議員過去關切」題目。":"建議補入主管科、最新數字、正式口徑與來源。";
   document.getElementById("source").textContent="尚無對應資料";return;
 }
 topic.textContent=best.topic;answer.textContent=best.answer;
 document.getElementById("numbers").textContent=best.numbers;
 document.getElementById("follow").textContent=best.follow;
 document.getElementById("source").textContent=best.source;
 nb.classList.remove("hidden");fb.classList.remove("hidden");sb.classList.remove("hidden");
}

document.querySelectorAll("[data-leg]").forEach(b=>b.addEventListener("click",()=>{selectLeg(b.dataset.leg);run("")}));
document.querySelectorAll("[data-q]").forEach(b=>b.addEventListener("click",()=>{qInput.value=b.dataset.q;run(b.dataset.q)}));
document.getElementById("searchBtn").addEventListener("click",()=>run(qInput.value));
qInput.addEventListener("keydown",e=>{if(e.key==="Enter")run(qInput.value)});
</script>
</body>
</html>
