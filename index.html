<style>
:root{--bg:#f6f8fb;--card:#fff;--text:#172033;--muted:#6b7280;--line:#dde3ec;--blue:#2563eb;--blueSoft:#eaf0ff;--warn:#fff8e8}

.qaQ{font-size:14px;font-weight:850;margin-bottom:6px}
.qaA{font-size:15px;line-height:1.65}
.note{background:var(--warn)}

.legQaQuestion b{display:inline;font-size:15px;color:var(--text);margin:0}
.legQaLabel{font-size:12px;font-weight:800;color:var(--muted);margin-top:10px;margin-bottom:4px}
.legQaText{font-size:15px;line-height:1.65}
.legQaNums{font-size:15px;font-weight:800;line-height:1.65}
.legQaFollow{margin-top:6px;padding:10px 12px;background:#f8fafc;border-radius:12px;font-size:14px;line-height:1.6}
.legQaAsOf{margin-top:10px;padding-top:9px;border-top:1px dashed var(--line);font-size:12px;font-weight:800;color:var(--muted)}
footer{text-align:center;color:var(--muted);font-size:11px;padding:18px 0 8px}
@media(max-width:640px){
 .wrap{padding:14px}
 h1{font-size:23px}

const legislatorQA={
"羅美文":[
{topic:"勞工教育五項訴求",question:"勞工教育五項訴求：講師費及名單透明、利益衝突規範、核心勞動法令與職安課程比例達七成、產業發展中心團協輔導資訊公開、建立人資法令溝通管道並擴充勞檢及勞權活動。",answer:"本府已依五項訴求分項檢討，包括補助規範與講師費、課程內容與比例、團體協約輔導資訊公開、人資勞動法令諮詢管道，以及勞檢與勞權宣導量能。涉及制度修正部分會依程序辦理，並持續向議會說明進度。",numbers:"目前勞動檢查員7人；每年勞動檢查及法遵訪視至少1,300件；另增置2名助理員協助行政庶務。",follow:"若追問HR勞動法令小學堂：該LINE社群是離職勞檢員私人建立，非本府官方帳號；正式諮詢管道為1999、縣民信箱及勞工處Facebook。",asOf:"原始題目及辦理進度截至115年9月22日",source:"《新竹縣議會第20屆-勞工處重要列管資料》／第七次定期會，第1案。"},
{topic:"普利司通關廠、大量解僱及勞工權益",question:"普利司通關廠、大量解僱及受影響勞工權益。議事錄提及約800人，與目前內部掌握之551人可能不一致。",answer:"本府已就大量解僱、勞資協商、資遣通報、資遣費或退休金，以及後續就業媒合與職訓協助分流處理。人數部分應以最新通報及實際名冊為準，並統一統計口徑後對外說明。",numbers:"最新列管進度記載：受影響員工共511人，其中本國勞工360人、移工191人；本國勞工360人中2人改留任；移工157人轉出、34人離境。",follow:"若追問為何議事錄約800人、內部數字不同：應說明不同時間點及統計口徑可能不同，備詢時以最新大量解僱計畫及實際人員名冊為準。",asOf:"最新辦理進度截至115年9月22日",source:"《新竹縣議會第20屆-勞工處重要列管資料》／第七次定期會，第2案。"},
{topic:"勞工業務報告量化成果",question:"勞工處業務報告欠缺量化成果；關注勞動人口、工會組織率及團體協約推動成效。",answer:"後續業務報告會強化量化成果與政策成效呈現，不只列活動場次，也會補充工會組織、會員數、團體協約輔導、勞資爭議及就業服務等成果指標。",numbers:"列管資料最新更新：目前工會175家，持續運作165家、未運作10家；團體協約輔導計畫已辦理3場說明會，並提供至少9場諮詢及輔導。",follow:"若追問為何業務報告數字與其他資料不同：要區分『登記家數』與『持續運作家數』，並在報告中統一註明統計口徑與截止日期。",asOf:"最新辦理進度截至115年9月19日",source:"《新竹縣議會第20屆-勞工處重要列管資料》／第七次定期會，第4案。"},
{topic:"校園勞動權益教育",question:"校園勞動權益教育應納入集體勞動權、工會及勞資爭議等內容。",answer:"本府目前與教育局採分工合作，由教育局協助通知各級學校，本處依學校需求提供專業師資，並持續把勞動權益、求職安全、集體勞動權及勞資爭議等主題納入校園宣導。",numbers:"列管進度記載：115年9月至10月預計辦理『促進就業平等』劇團巡迴表演10場次。",follow:"若追問是否會制度化：可答將持續與教育局協調課程主題、師資與入校場次，並逐步建立可重複使用的教材與師資資源。",asOf:"列管進度截至115年9月",source:"《新竹縣議會第20屆-勞工處重要列管資料》／第七次定期會，第10案。"}
],
"歐陽霆":[
{topic:"移工失聯、高風險雇主及仲介管理",question:"移工失聯、高風險雇主、仲介分級及跨機關資訊串接；強化前端風險辨識與查察。",answer:"本府會從高風險雇主管理、仲介品質控管及跨機關資訊共享三個面向持續強化，並以案件列管方式追蹤受理、完成、未結、逾期及結案率，提升前端風險辨識與查察效率。",numbers:"本案列管要求每月更新外籍移工查察案件受理數、完成數、未結數、逾期數及結案率。",follow:"若追問跨機關怎麼做：會持續與警察局、移民署及相關中央機關建立資訊共享及案件協作機制。",asOf:"原始題目取自第20屆第7次定期會列管表；本案持續每月更新",source:"《新竹縣議會第20屆-勞工處重要列管資料》／第七次定期會，第3案。"}
],
"朱健銘":[
{section:"福利科",topic:"高齡及中高齡再就業",question:"我國人口高齡及少子化，為支持勞工退休後重返職場再就業，並鼓勵事業單位留用屆齡員工傳承經驗，對於高齡及中高齡的再就業，本府的因應作為在哪？",answer:"本府已設置銀髮人才服務據點，從職業諮詢、企業開發、擴大宣導到就業媒合四個面向推動中高齡及高齡者再就業；同時持續開發湖口工業區周邊企業職缺，協助企業運用中高齡及高齡人力。",numbers:"求職求才服務573人次；法令及職涯諮詢447人次；銀髮人力開發272人次；成功媒合131人。",follow:"若追問如何鼓勵企業留用屆齡員工：可結合企業開發、職務調整、工作流程改善及中央促進就業資源，降低續留與再僱用門檻。",asOf:"服務成果數據截至115年9月29日",source:"使用者提供之朱健銘議員福利科預擬問題；第20屆第8次定期會業務報告。"},
{section:"福利科",topic:"庇護工場設立、營運補助及創新作為",question:"庇護工場是為具有就業意願、但就業能力不足而無法在一般競爭性就業市場立足的身心障礙者，提供長期支持與工作機會的重要場域。本府對於庇護工廠的設立及營運，有何補助措施及創新作為？",answer:"本府依身心障礙者庇護性就業相關規定辦理設立、營運輔導與補助，並透過職業重建、職場支持及就業力提升，協助庇護性就業者穩定工作；創新方向則是強化職能提升、職場體驗及有能力者轉銜一般職場。",numbers:"第20屆第8次定期會業務報告載有4家庇護工場；如備詢需報最新實際營運家數，建議福利科再以當日最新名冊確認。",follow:"若追問創新作為：重點是從單純庇護工作，延伸到職能提升、職場體驗、工作培訓與一般職場轉銜。",asOf:"題目截至115年10月5日；庇護工場家數以115年9月29日業務報告為基準",source:"使用者提供之朱健銘議員福利科預擬問題；第20屆第8次定期會業務報告。"},
{topic:"職業災害勞工服務",question:"職業災害勞工之補助、法律協助、醫療復健與重返職場服務。",answer:"本府已建置職災勞工協助流程，從個案受理、慰助、法律諮詢、心理支持、醫療復健到重返職場提供服務，並依個案需要串接相關單位。",numbers:"本案已於115年5月18日函覆議員及議會；另115年9月29日業務報告載職災慰問24件、35萬5,000元，職能復健津貼12案、16萬6,148元。",follow:"若追問實際成效：可補充服務人次、結案及復工情形，並說明依個案需求轉介職能復健及就業服務。",asOf:"列管回覆截至115年9月22日；業務數據截至115年9月29日",source:"《新竹縣議會第20屆-勞工處重要列管資料》／第七次定期會，第5案；第20屆第8次定期會業務報告。"},
{topic:"外籍移工遭霸凌或不當對待",question:"外籍移工遭霸凌或不當對待之申訴管道及宣導。",answer:"目前移工最常使用的申訴與諮詢管道為勞動部1955勞工諮詢申訴專線，24小時全年無休並提供多語服務；本府也透過入境講習、宿舍檢查及多元活動加強申訴管道宣導，案件由縣市政府接續協處。",numbers:"1955專線為24小時全年無休；本案已於115年5月18日函覆議員及議會。",follow:"若追問地方怎麼接案：1955派案後由本府依案件性質辦理協處、轉介、查處或保護安置，並持續追蹤結果。",asOf:"列管進度截至115年9月22日",source:"《新竹縣議會第20屆-勞工處重要列管資料》／第七次定期會，第6案。"},

let selectedLeg="全部";
const qInput=document.getElementById("qInput");

function resetMainAnswer(){
 qInput.value="";
 document.getElementById("topic").textContent="請選擇上方題目";
 document.getElementById("answer").textContent="點選該議員過去關切的題目，即可直接查看建議答法。";
 document.getElementById("numbersBox").classList.add("hidden");
 document.getElementById("followBox").classList.add("hidden");
 document.getElementById("sourceBox").classList.add("hidden");
}

function renderLegTopicButtons(name){
 const row=document.getElementById("topicRow");
 const title=document.getElementById("commonTitle");
 row.innerHTML="";
 if(name==="全部"){
   title.textContent="常用題目";
   [
     ["身障就業","身障就業"],["銀髮就業","銀髮就業"],["勞檢人力","勞檢人力"],
     ["HR勞動法令小學堂","HR小學堂"],["預算","預算"],["移工","移工"],["工會","工會"]
   ].forEach(([q,label])=>{
     const b=document.createElement("button");
     b.className="topicBtn"; b.dataset.q=q; b.textContent=label;
     b.addEventListener("click",()=>{qInput.value=q;run(q)});
     row.appendChild(b);
   });
   return;
 }
 title.textContent=name+"議員題目";
 (legislatorQA[name]||[]).forEach(x=>{
   const b=document.createElement("button");
   b.className="topicBtn"; b.textContent=x.topic;
   b.addEventListener("click",()=>{
     qInput.value=x.topic;
     document.getElementById("topic").textContent=x.topic;
     document.getElementById("answer").textContent=x.answer;
     document.getElementById("numbers").textContent=x.numbers;
     document.getElementById("numbersBox").classList.remove("hidden");
     const follow=document.getElementById("follow");
     follow.innerHTML="";
     const item=document.createElement("div"); item.className="qaItem";
     const q=document.createElement("div"); q.className="qaQ"; q.textContent="可能追問";
     const a=document.createElement("div"); a.className="qaA"; a.textContent=x.follow;
     item.append(q,a); follow.appendChild(item);
     document.getElementById("followBox").classList.remove("hidden");
     document.getElementById("source").textContent=(x.asOf||"資料截至115年9月29日")+(x.source?"｜"+x.source:"｜"+name+"議員過去質詢／關切題目整理");
     document.getElementById("sourceBox").classList.remove("hidden");
   });
   row.appendChild(b);
 });
}

function selectLeg(name){
 selectedLeg=name;
 document.querySelectorAll("[data-leg]").forEach(b=>b.classList.toggle("active",b.dataset.leg===name));
 const box=document.getElementById("legHistory");
 const qa=document.getElementById("legQa");

 resetMainAnswer();
 renderLegTopicButtons(name);

 if(name==="全部"){
   box.classList.add("hidden");
   qa.innerHTML="";
   document.getElementById("topic").textContent="請選議員或輸入問題";
   document.getElementById("answer").textContent="系統會先查內建題庫；題庫沒有或涉及最新資訊時，AI 會自動查找公開資料。";
   return;
 }

 document.getElementById("legTitle").textContent=name+"議員過去關切";
 document.getElementById("legTopics").textContent=(history[name]||[]).join("、");
 qa.innerHTML="";

 (legislatorQA[name]||[]).forEach(x=>{
   const card=document.createElement("div"); card.className="legQaCard";
   const title=document.createElement("div"); title.className="legQaTitle"; title.textContent=x.topic;
   const section=document.createElement("div"); section.className="legQaSection"; section.textContent=x.section||"";
   if(!x.section) section.classList.add("hidden");
   const qBox=document.createElement("div"); qBox.className="legQaQuestion";
   qBox.innerHTML="<b>原始題目：</b>"+(x.question||"目前未取得原始逐字題目；以下依既有列管題名呈現。");
   const aLab=document.createElement("div"); aLab.className="legQaLabel"; aLab.textContent="30秒速答";
   const a=document.createElement("div"); a.className="legQaText"; a.textContent=x.answer;
   const nLab=document.createElement("div"); nLab.className="legQaLabel"; nLab.textContent="關鍵數字";
   const n=document.createElement("div"); n.className="legQaNums"; n.textContent=x.numbers;
   const fLab=document.createElement("div"); fLab.className="legQaLabel"; fLab.textContent="可能追問";
   const follow=document.createElement("div"); follow.className="legQaFollow"; follow.textContent=x.follow;
   const asOf=document.createElement("div"); asOf.className="legQaAsOf";
   asOf.textContent=(x.asOf||"資料截至115年9月29日")+(x.source?"｜"+x.source:"");
   card.append(section,title,qBox,aLab,a,nLab,n,fLab,follow,asOf);
   qa.appendChild(card);
 });
 box.classList.remove("hidden");
}

function showLocal(best){

 topic.textContent=best.topic;
 answer.textContent=best.answer;
 document.getElementById("numbers").textContent=best.numbers;

 follow.innerHTML="";
 (best.followups||[]).forEach(x=>{
   const item=document.createElement("div"); item.className="qaItem";

function renderAI(data, question){
 const topic=document.getElementById("topic"),answer=document.getElementById("answer");
 const nb=document.getElementById("numbersBox"),fb=document.getElementById("followBox"),sb=document.getElementById("sourceBox");
 topic.textContent="AI 智慧速答："+question;
 answer.textContent=data.answer||"";
 nb.classList.add("hidden");
 fb.classList.add("hidden");
 const src=document.getElementById("source");
 src.innerHTML="";
 if(Array.isArray(data.sources) && data.sources.length){
   data.sources.slice(0,6).forEach((s,i)=>{
     const a=document.createElement("a");
     a.href=s.url; a.target="_blank"; a.rel="noopener noreferrer";
     a.textContent=(i+1)+". "+(s.title||s.url);
     a.style.display="block"; a.style.margin="4px 0";
     src.appendChild(a);
   });
 }else{
   src.textContent=data.usedWeb ? "AI 已啟用網路搜尋，但本次未取得可顯示的來源連結。" : "依內建議會資料整理。";
 }
 sb.classList.remove("hidden");
}

async function askAI(question){
 const btn=document.getElementById("searchBtn");
 const topic=document.getElementById("topic");
 const answer=document.getElementById("answer");
 btn.disabled=true; btn.textContent="查詢中…";
 topic.textContent="正在查詢："+question;
 answer.textContent="正在比對議會題庫與最新公開資料，必要時會自動切換備援服務。";
 document.getElementById("numbersBox").classList.add("hidden");
 document.getElementById("followBox").classList.add("hidden");
 document.getElementById("sourceBox").classList.add("hidden");
 try{
   const r=await fetch("/api/ask",{
     method:"POST",
     headers:{"Content-Type":"application/json"},
     body:JSON.stringify({question,legislator:selectedLeg})
   });
   const data=await r.json();
   if(!r.ok) throw new Error(data.error||"AI 服務暫時無法使用");
   renderAI(data,question);
 }catch(e){
   topic.textContent="智慧查詢暫時離線";
   answer.textContent="目前雲端 AI 服務暫時無法連線。若是既有議會題目，可先使用上方常用題目；若要查最新規定，可先開啟網路搜尋。";
   const sb=document.getElementById("sourceBox");
   const src=document.getElementById("source");
   src.innerHTML="";
   const a=document.createElement("a");
   a.href="https://www.google.com/search?q="+encodeURIComponent(question);
   a.target="_blank"; a.rel="noopener noreferrer";
   a.textContent="開啟 Google 搜尋：「"+question+"」";
   a.style.display="inline-block";
   a.style.marginTop="4px";
   src.appendChild(a);
   sb.classList.remove("hidden");
 }finally{
   btn.disabled=false; btn.textContent="智慧速答";
 }
}

async function run(q){
 q=(q||"").trim();
 const topic=document.getElementById("topic"),answer=document.getElementById("answer");
 const nb=document.getElementById("numbersBox"),fb=document.getElementById("followBox"),sb=document.getElementById("sourceBox");

 if(!q){
   if(selectedLeg!=="全部"){
     topic.textContent=selectedLeg+"議員過去關切題";
     answer.textContent=(history[selectedLeg]||[]).join("、")||"目前尚未整理到該議員的歷史題目。";
   }else{
     topic.textContent="請選議員或輸入問題";
     answer.textContent="系統會先查內建題庫；題庫沒有或涉及最新資訊時，AI 會自動上網查找公開資料。";
   }
   nb.classList.add("hidden");fb.classList.add("hidden");sb.classList.add("hidden");return;
 }

 let best=null,score=0;
 data.forEach(item=>{let s=item.keys.reduce((n,k)=>n+(q.includes(k)?1:0),0);if(s>score){score=s;best=item;}});
 const needsFresh=/(最新|目前|現在|今日|今天|今年|近期|最近|修法|新制|公告|新聞|現況|截至)/.test(q);

 if(best && !needsFresh){
   showLocal(best);
   return;
 }
 await askAI(q);
}

document.querySelectorAll("[data-leg]").forEach(b=>b.addEventListener("click",()=>{selectLeg(b.dataset.leg);}));
renderLegTopicButtons("全部");
document.getElementById("searchBtn").addEventListener("click",()=>run(qInput.value));
qInput.addEventListener("keydown",e=>{if(e.key==="Enter")run(qInput.value)});
</script>
</body>
